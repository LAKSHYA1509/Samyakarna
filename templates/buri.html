<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blacklist Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
        }

        .container {
            background-color: #27293d;
            padding: 177px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            max-width: 478px;
            width: 100%;
            text-align: center;
            border: 2px solid #4e4e6d;
        }

        h1 {
            font-size: 35px;
            margin-bottom: 20px;
            color: #f1f1f1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #b3b3cc;
            font-size: 30px;
        }

        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #4e4e6d;
            border-radius: 6px;
            background-color: #1e1e2f;
            color: #f1f1f1;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00bcd4;
        }

        button {
            padding: 12px 20px;
            background-color: #00bcd4;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 22px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #0097a7;
            transform: scale(1.05);
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-safe {
            color: #4caf50;
        }

        .status-warning {
            color: #ffa726;
        }

        .status-danger {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sadvik - Samyakaran's Blacklist checker</h1>
        <form id="blacklist-form">
            <label for="wallet_address">Enter Wallet Address:</label>
            <input type="text" id="wallet_address" name="wallet_address" placeholder="0x..." required>
            <button type="button" onclick="checkBlacklist()">Check Status</button>
        </form>
        <p id="status"></p>
    </div>

    <script>
        // The JS code remains unchanged as per your request
        function checkBlacklist() {
            const address = document.getElementById('wallet_address').value;

            fetch('/check_blacklist', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({ 'wallet_address': address })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Response data:', data);  // Log the response data
                const statusElement = document.getElementById('status');
                
                if (data.status === 'success') {
                    const riskScore = data.risk_score;
                    const indicators = data.risk_indicators.map(ind => ind.indicator.name).join(', ');
                    statusElement.innerText = `Risk Score: ${riskScore}. Risk Indicators: ${indicators}`;
                    
                    if (riskScore === 0) {
                        statusElement.className = 'status-safe';
                    } else if (riskScore < 5) {
                        statusElement.className = 'status-warning';
                    } else {
                        statusElement.className = 'status-danger';
                        speakScammedAlert();
                    }
                } else {
                    statusElement.innerText = data.message;
                    statusElement.className = 'status-warning';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                const statusElement = document.getElementById('status');
                statusElement.innerText = 'Given Account is not possessed with any type of SCAM';
                statusElement.className = 'status-safe';
            });
        }

        function speakScammedAlert() {
            const message = "This is a scammed account. Please be aware!";
            const speech = new SpeechSynthesisUtterance(message);
            speech.lang = 'en-US';
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
